[tools]
node = "24"
d2 = "0.9.0"
# `op run --environment` needs 2.39.1-beta.01 or later; 2.40.0 stable
# dropped the flag, so pin a beta that still has it.
1password-cli = "2.40.0-beta.02"

[env]
# OP_SERVICE_ACCOUNT_TOKEN and OP_ENVIRONMENT_ID only (gitignored; absent in
# CI). App secrets (Sentry DSNs, Axiom) come from the 1Password Environment
# via `mise run op -- <cmd>`.
_.file = ".env"

[tasks.op]
hide = true
description = "Run a command with 1Password Environment secrets"
usage = 'arg "<cmd>..." double_dash="preserve" help="Command to run with secrets"'
raw = true
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
eval "set -- $usage_cmd"
[[ "${1:-}" == "--" ]] && shift
(( $# )) || { echo "usage: mise run op -- <cmd>" >&2; exit 2; }
wrap=()
# Nested calls (dev -> build) already have the secrets. With no `.env` (CI,
# fresh clones) the command runs without secrets.
if [[ -z "${UNVIBE_OP_RUN:-}" && -n "${OP_ENVIRONMENT_ID:-}" ]]; then
  wrap=(op run --environment "$OP_ENVIRONMENT_ID" --)
fi
# ${wrap[@]+...}: bash 3.2 (macOS) treats an empty array as unbound under `set -u`.
UNVIBE_OP_RUN=1 exec ${wrap[@]+"${wrap[@]}"} "$@"
'''

[tasks.install]
description = "Install npm workspace dependencies"
run = "npm install"
# Same missing-`outputs` trap as `build` (issue #39): without an output, a
# deleted `node_modules/` never invalidated the task. npm records the
# installed tree in `node_modules/.package-lock.json` on every platform, so
# removing `node_modules/` reruns the install. The lockfile is a source: a
# changed dependency graph must reinstall even when no manifest changed.
sources = ["package.json", "package-lock.json", "packages/*/package.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Run service + Vite dev server together"
raw = true
run = "mise run op -- node ./scripts/dev.mjs"
depends = ["build"]
sources = ["packages/service/src/**/*.ts", "packages/web/src/**/*", "packages/shared/src/**/*"]
# A dev server writes no files: `outputs = []` declares that, so freshness
# checks never skip it (issue #39). The `sources` stay for `mise watch`.
outputs = []

[tasks."dev:mock"]
description = "Run the web UI against the in-memory mock API (no service needed)"
raw = true
run = "VITE_MOCK=1 mise run op -- npm run dev --workspace @unvibe/web --if-present"
sources = ["packages/web/src/**/*", "packages/shared/src/**/*"]
# As above: no output files, so never skip (issue #39).
outputs = []

[tasks."test:e2e"]
description = "Playwright behaviour tests against mock mode (needs browsers: mise run playwright-install)"
# The real-service specs boot `packages/service/dist/index.js`; ensure a build
# exists first (issue #39). A fresh build is skipped, so this is a no-op then.
depends = ["build"]
run = "npm run test:e2e --workspace @unvibe/web --if-present"

[tasks.journeys]
description = "Real-service journeys J1-J7 plus the visual tour (#188): one spec per journey against the built service"
depends = ["build"]
run = "npx --workspace @unvibe/web playwright test e2e/journeys/ e2e/visual-tour.spec.ts"

[tasks."visual-tour"]
description = "Visual tour against the real built service (demo + replay agent, browser): screenshots in packages/web/visual-tour/ (owner reviews every one)"
depends = ["build"]
run = "npx --workspace @unvibe/web playwright test e2e/visual-tour.spec.ts"

[tasks."playwright-install"]
description = "Install Playwright browsers for e2e tests"
run = "npx --workspace @unvibe/web playwright install chromium"

[tasks."build:shared"]
description = "Build @unvibe/shared"
run = "mise run op -- npm run build --workspace @unvibe/shared"
# Freshness (issue #64): one task per package, each with only its own
# sources and outputs. The old single `build` task mixed all three
# packages' outputs, so a freshly rebuilt `packages/shared/dist/index.js`
# could make the whole task count as fresh while web/service dists were
# stale. Splitting keeps `mise run build` skipping when nothing changed
# while a change under any package's `src` rebuilds that package.
sources = [
  "package.json",
  "package-lock.json",
  "tsconfig.base.json",
  "packages/shared/src/**/*",
  "packages/shared/package.json",
  "packages/shared/tsconfig.json",
]
outputs = ["packages/shared/dist", "packages/shared/dist/index.js"]

[tasks."build:service"]
description = "Build @unvibe/service"
depends = ["build:shared"]
run = "mise run op -- npm run build --workspace @unvibe/service"
# `packages/shared/dist/index.js` is a source here, not just a build
# ordering edge: esbuild bundles it, so a rebuilt shared dist must
# rebuild the service bundle even when no service source changed.
sources = [
  "package.json",
  "package-lock.json",
  "tsconfig.base.json",
  "packages/service/src/**/*",
  "packages/service/package.json",
  "packages/service/tsconfig.json",
  "packages/shared/dist/index.js",
]
outputs = [
  "packages/service/dist",
  "packages/service/dist/index.js",
  "packages/service/dist/update-helper.js",
  "packages/service/dist/adapters/claude.js",
  "packages/service/dist/adapters/codex.js",
]

[tasks."build:web"]
description = "Build @unvibe/web"
depends = ["build:shared"]
run = "mise run op -- npm run build --workspace @unvibe/web --if-present"
# Same shared-dist note as `build:service`: vite resolves
# `@unvibe/shared` to its dist, so a rebuilt shared dist rebuilds web.
# Web's `tsc --noEmit` also typechecks `e2e/`, `vite.config.ts` and
# `playwright.config.ts`, failing the build on type errors there.
sources = [
  "package.json",
  "package-lock.json",
  "tsconfig.base.json",
  "packages/web/src/**/*",
  "packages/web/package.json",
  "packages/web/tsconfig.json",
  "packages/web/e2e/**/*",
  "packages/web/index.html",
  "packages/web/public/**/*",
  "packages/web/vite.config.ts",
  "packages/web/playwright.config.ts",
  "packages/shared/dist/index.js",
]
outputs = [
  "packages/web/dist",
  "packages/web/dist/index.html",
  "packages/web/dist/web-meta.json",
]

[tasks.build]
description = "Build shared, service and web"
# Aggregate (issue #64): no `sources`/`outputs`/`run` of its own, so all
# freshness lives in the per-package tasks above. `mise run build` stays
# the one command people run; with nothing changed every subtask skips.
depends = ["build:shared", "build:service", "build:web"]

[tasks."build-freshness"]
description = "Check per-package build freshness (issue #64): a web change + shared rebuild must not skip; no change must skip"
run = "node scripts/build-freshness-check.mjs"

[tasks.test]
description = "All automated tests that need no login (fast suite, then slow suite)"
run = "mise run test:fast && mise run test:slow"

[tasks."test:fast"]
description = "Fast unit tests: lint/typecheck-fast vitest files, no build, no browser"
run = "npm run build --workspace @unvibe/shared && npm run test:fast --workspaces --if-present"

[tasks."test:slow:unit"]
description = "Slow vitest files (*.slow.test.*: need a build or a real binary)"
depends = ["build"]
run = "npm run test:slow --workspaces --if-present"

[tasks."test:slow"]
description = "Slow suite: slow vitest files, then Playwright behaviour tests"
run = "mise run test:slow:unit && mise run test:e2e"

[tasks.restart-resilience]
description = "SIGKILL mid-stage, restart, resume against the built service"
depends = ["build"]
run = "node scripts/restart-resilience.mjs"

[tasks.gate]
description = "Pre-merge gate: every gate in sequence (one full run at a time per DEVELOPMENT.md; no lock script by owner decision)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run check
mise run build
mise run test:slow
mise run build-freshness
if [[ "$(uname)" == "Darwin" ]]; then
  mise run e2e:macos
else
  mise run e2e
fi
mise run restart-resilience
node scripts/d2-seed-check.mjs --strict
mise run check-global-install
'''

[tasks."test:live"]
description = "Live ACP adapter tests (needs claude/codex logins; small token spend)"
run = "npm run build --workspace @unvibe/shared && UNVIBE_LIVE=1 UNVIBE_ALLOW_LIVE_AGENT=1 npm run test:live --workspace @unvibe/service"

[tasks.lint]
description = "Run ESLint"
run = "npx eslint ."

[tasks.typecheck]
description = "Typecheck all workspaces"
run = "npm run build --workspace @unvibe/shared && npm run typecheck --workspaces --if-present"

[tasks."typecheck:tests"]
description = "Typecheck test files in all workspaces (blocking, issue #127; web tests live in src, so its tsconfig covers them)"
run = "npm run build --workspace @unvibe/shared && npm run typecheck:tests --workspaces --if-present"

[tasks.check]
description = "Fast suite: lint + typecheck + test typecheck in parallel, then fast unit tests"
depends = ["lint", "typecheck", "typecheck:tests"]
run = "mise run test:fast"

[tasks.start]
description = "Run the built service"
raw = true
# Needs `dist/`; build first when stale (issue #39), a no-op when fresh.
depends = ["build"]
run = "mise run op -- node packages/service/dist/index.js"

[tasks.fixture-snapshot]
description = "Build fixtures/urllib3-5020/snapshot.json from the recordings (fails on unverified citations)"
run = "npm run fixture:snapshot --workspace @unvibe/service"

[tasks.setup]
description = "Build, then run unvibe setup (token + unvibe:// handler)"
run = "mise run build && node packages/service/dist/index.js setup"

[tasks.doctor]
description = "Build, then run unvibe doctor (environment checks)"
run = "mise run build && node packages/service/dist/index.js doctor"

[tasks.e2e]
description = "Linux end-to-end: setup, handler start, reuse, idle exit, uninstall"
run = "mise run build && node scripts/e2e-linux.mjs"

[tasks."e2e:macos"]
description = "macOS end-to-end: setup, helper app, handler start, reuse, idle exit, uninstall"
run = "mise run build && node scripts/e2e-macos.mjs"

[tasks.check-global-install]
description = "Release-install the tarball + git ref into temp prefixes (npm 10+11), run doctor/start/demo outside the repo"
run = "mise run release && node scripts/global-install-check.mjs"

[tasks.release]
description = "Assemble the self-contained release tree, tarball, and local release branch"
run = "mise run build && node scripts/release.mjs"

[tasks."preview:publish"]
description = "Publish a branch as an installable preview/<slug> ref (builds; pushes only with --push)"
run = "node scripts/preview-publish.mjs"

[tasks."release:tag"]
description = "Cut a final release tag: clean/main/CI-green checks, version bump, tag"
run = "node scripts/release-tag.mjs"

[tasks."test:live:installed"]
description = "Live sessions per provider from the installed copy (pi, claude, codex; needs logins; tiny spend, capped; never run by check)"
run = "mise run release && UNVIBE_LIVE=1 UNVIBE_ALLOW_LIVE_AGENT=1 node scripts/live-installed.mjs"

[tasks."test:live:submit"]
description = "Live M6 submit test on indigoviolet/lvu (draft PR only; pipeline agent turns on pi by default; capped; never run by check)"
run = "UNVIBE_LIVE=1 UNVIBE_ALLOW_LIVE_AGENT=1 node ./scripts/live-submit.mjs"

[tasks."test:live:pipeline"]
description = "Live M3 pipeline smoke on real agents (default pi; token spend, capped; never run by check)"
run = "mise run build && UNVIBE_ALLOW_LIVE_AGENT=1 node scripts/live-pipeline.mjs"

[tasks."test:live:plotlines"]
description = "Live #169 evaluation: hunk scores + plotlines on the demo and public flask PRs (default pi; token spend, capped; read-only, never posts; never run by check)"
run = "mise run build && UNVIBE_ALLOW_LIVE_AGENT=1 node scripts/live-plotlines-169.mjs"

[tasks."test:live:hunk-cap"]
description = "Live #210 measurement: hunk-pass wall/run/queue times at sessionsPerProvider caps (usage: mise run test:live:hunk-cap -- --repo-path <checkout> --pr <n> [--caps 4,8,16,32]; default pi; small token spend, capped; never run by check)"
run = "mise run build && UNVIBE_ALLOW_LIVE_AGENT=1 node scripts/live-hunk-cap.mjs"

[tasks."test:live:second-opinion"]
description = "Live second-opinion check: blind on one finding with real agents (main=Claude, second=Codex; small token spend; never run by check)"
run = "mise run build && UNVIBE_ALLOW_LIVE_AGENT=1 node scripts/live-second-opinion.mjs"

[tasks."test:live:diagram"]
description = "Live D2 diagram check: real diagram action per provider with cite + render asserts (needs logins, d2; small token spend; never run by check)"
run = "mise run build && UNVIBE_ALLOW_LIVE_AGENT=1 node scripts/live-diagram.mjs"

[tasks."test:live:full-access"]
description = "Live full-access check (#160): session+fork git/gh/web/tool run plus the injection measurement (default pi; UNVIBE_LIVE_CAP required; never run by check)"
run = "npm run build --workspace @unvibe/shared && UNVIBE_LIVE=1 UNVIBE_ALLOW_LIVE_AGENT=1 npm run test:live:full-access --workspace @unvibe/service"

[tasks."test:live:fork-tools"]
description = "Live #124 check: a Codex fork calls a review tool (needs codex login; tiny spend; never run by check)"
run = "npm run build --workspace @unvibe/shared && UNVIBE_LIVE=1 UNVIBE_ALLOW_LIVE_AGENT=1 UNVIBE_LIVE_PROVIDERS=codex npm run test:live:fork-tools --workspace @unvibe/service"

[tasks."test:live:pi"]
description = "Live pi check (#279): subscription login, review tools in a fork, resume, usage split on real pi (needs the owner's pi login and go; small spend; never run by check)"
run = "npm run build --workspace @unvibe/shared && UNVIBE_PI_LIVE=1 UNVIBE_ALLOW_LIVE_AGENT=1 npm run test:live:pi --workspace @unvibe/service"
