[tools]
node = "24"
d2 = "0.9.0"
# `op run --environment` needs 2.39.1-beta.01 or later; 2.40.0 stable
# dropped the flag, so pin a beta that still has it.
1password-cli = "2.40.0-beta.02"

[env]
# OP_SERVICE_ACCOUNT_TOKEN and OP_ENVIRONMENT_ID only (gitignored; absent in
# CI). App secrets (Sentry DSNs, Axiom) come from the 1Password Environment
# via `mise run op -- <cmd>`.
_.file = ".env"

[tasks.op]
hide = true
description = "Run a command with 1Password Environment secrets"
usage = 'arg "<cmd>..." double_dash="preserve" help="Command to run with secrets"'
raw = true
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
eval "set -- $usage_cmd"
[[ "${1:-}" == "--" ]] && shift
(( $# )) || { echo "usage: mise run op -- <cmd>" >&2; exit 2; }
wrap=()
# Nested calls (dev -> build) already have the secrets. With no `.env` (CI,
# fresh clones) the command runs without secrets.
if [[ -z "${UNVIBE_OP_RUN:-}" && -n "${OP_ENVIRONMENT_ID:-}" ]]; then
  wrap=(op run --environment "$OP_ENVIRONMENT_ID" --)
fi
# ${wrap[@]+...}: bash 3.2 (macOS) treats an empty array as unbound under `set -u`.
UNVIBE_OP_RUN=1 exec ${wrap[@]+"${wrap[@]}"} "$@"
'''

[tasks.install]
description = "Install npm workspace dependencies"
run = "npm install"
# Same missing-`outputs` trap as `build` (issue #39): without an output, a
# deleted `node_modules/` never invalidated the task. npm records the
# installed tree in `node_modules/.package-lock.json` on every platform, so
# removing `node_modules/` reruns the install. The lockfile is a source: a
# changed dependency graph must reinstall even when no manifest changed.
sources = ["package.json", "package-lock.json", "packages/*/package.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Run service + Vite dev server together"
raw = true
run = "mise run op -- node ./scripts/dev.mjs"
depends = ["build"]
sources = ["packages/service/src/**/*.ts", "packages/web/src/**/*", "packages/shared/src/**/*"]
# A dev server writes no files: `outputs = []` declares that, so freshness
# checks never skip it (issue #39). The `sources` stay for `mise watch`.
outputs = []

[tasks."dev:mock"]
description = "Run the web UI against the in-memory mock API (no service needed)"
raw = true
run = "VITE_MOCK=1 mise run op -- npm run dev --workspace @unvibe/web --if-present"
sources = ["packages/web/src/**/*", "packages/shared/src/**/*"]
# As above: no output files, so never skip (issue #39).
outputs = []

[tasks."test:e2e"]
description = "Playwright behaviour tests against mock mode (needs browsers: mise run playwright-install)"
# The real-service specs boot `packages/service/dist/index.js`; ensure a build
# exists first (issue #39). A fresh build is skipped, so this is a no-op then.
depends = ["build"]
run = "npm run test:e2e --workspace @unvibe/web --if-present"

[tasks."playwright-install"]
description = "Install Playwright browsers for e2e tests"
run = "npx --workspace @unvibe/web playwright install chromium"

[tasks.build]
description = "Build shared, service and web"
run = "mise run op -- sh -c 'npm run build --workspaces --if-present && npm run build --workspace @unvibe/web --if-present'"
# Freshness (issue #39): with `sources` but no `outputs`, mise falls back to
# `outputs = { auto = true }` — a marker file in its state dir — so deleting
# `dist/` never invalidated the task and the build was skipped. The explicit
# `outputs` below are the directories plus the load-bearing files
# (`scripts/release.mjs` and the service entry require them), so a missing or
# partial `dist/` makes the task stale again.
# Sources cover everything the builds read: tsc reads the base + package
# tsconfigs (web's `tsc --noEmit` also typechecks `e2e/`, `vite.config.ts` and
# `playwright.config.ts`, failing the build on type errors there); vite reads
# `index.html`, `public/` and `vite.config.ts`; the root manifests pin the
# installed dependency tree that esbuild/vite bundle.
sources = [
  "package.json",
  "package-lock.json",
  "tsconfig.base.json",
  "packages/*/src/**/*",
  "packages/*/package.json",
  "packages/*/tsconfig.json",
  "packages/web/e2e/**/*",
  "packages/web/index.html",
  "packages/web/public/**/*",
  "packages/web/vite.config.ts",
  "packages/web/playwright.config.ts",
]
outputs = [
  "packages/shared/dist",
  "packages/service/dist",
  "packages/web/dist",
  "packages/shared/dist/index.js",
  "packages/service/dist/index.js",
  "packages/service/dist/update-helper.js",
  "packages/service/dist/adapters/claude.js",
  "packages/service/dist/adapters/codex.js",
  "packages/web/dist/index.html",
  "packages/web/dist/web-meta.json",
]

[tasks.test]
description = "Run vitest across workspaces"
run = "npm run build --workspace @unvibe/shared && npm run test --workspaces --if-present"

[tasks."test:live"]
description = "Live ACP adapter tests (needs claude/codex logins; small token spend)"
run = "npm run build --workspace @unvibe/shared && UNVIBE_LIVE=1 npm run test:live --workspace @unvibe/service"

[tasks.lint]
description = "Run ESLint"
run = "npx eslint ."

[tasks.typecheck]
description = "Typecheck all workspaces"
run = "npm run build --workspace @unvibe/shared && npm run typecheck --workspaces --if-present"

[tasks.check]
description = "lint + typecheck + test"
run = "mise run lint && mise run typecheck && mise run test"

[tasks.start]
description = "Run the built service"
raw = true
# Needs `dist/`; build first when stale (issue #39), a no-op when fresh.
depends = ["build"]
run = "mise run op -- node packages/service/dist/index.js"

[tasks.fixture-snapshot]
description = "Build fixtures/urllib3-5020/snapshot.json from the recordings (fails on unverified citations)"
run = "npm run fixture:snapshot --workspace @unvibe/service"

[tasks.setup]
description = "Build, then run unvibe setup (token + unvibe:// handler)"
run = "mise run build && node packages/service/dist/index.js setup"

[tasks.doctor]
description = "Build, then run unvibe doctor (environment checks)"
run = "mise run build && node packages/service/dist/index.js doctor"

[tasks.e2e]
description = "Linux end-to-end: setup, handler start, reuse, idle exit, uninstall"
run = "mise run build && node scripts/e2e-linux.mjs"

[tasks."e2e:macos"]
description = "macOS end-to-end: setup, helper app, handler start, reuse, idle exit, uninstall"
run = "mise run build && node scripts/e2e-macos.mjs"

[tasks.check-global-install]
description = "Release-install the tarball + git ref into temp prefixes (npm 10+11), run doctor/start/demo outside the repo"
run = "mise run release && node scripts/global-install-check.mjs"

[tasks.release]
description = "Assemble the self-contained release tree, tarball, and local release branch"
run = "mise run build && node scripts/release.mjs"

[tasks."preview:publish"]
description = "Publish a branch as an installable preview/<slug> ref (builds; pushes only with --push)"
run = "node scripts/preview-publish.mjs"

[tasks."release:tag"]
description = "Cut a release tag: clean/main/CI-green checks, version bump for finals, tag (rc tags: no bump)"
run = "node scripts/release-tag.mjs"

[tasks."test:live:installed"]
description = "Live sessions per provider from the installed copy (needs logins; tiny spend; never run by check)"
run = "mise run release && UNVIBE_LIVE=1 node scripts/live-installed.mjs"

[tasks."test:live:submit"]
description = "Live M6 submit test on indigoviolet/lvu (draft PR only; never run by check)"
run = "node ./scripts/live-submit.mjs"

[tasks."test:live:pipeline"]
description = "Live M3 pipeline smoke on real agents (claude+codex; token spend; never run by check)"
run = "mise run build && node scripts/live-pipeline.mjs"

[tasks."test:live:second-opinion"]
description = "Live second-opinion check: blind on one finding with real agents (main=Claude, second=Codex; small token spend; never run by check)"
run = "mise run build && node scripts/live-second-opinion.mjs"

[tasks."test:live:diagram"]
description = "Live D2 diagram check: real diagram action per provider with cite + render asserts (needs logins, d2; small token spend; never run by check)"
run = "mise run build && node scripts/live-diagram.mjs"
