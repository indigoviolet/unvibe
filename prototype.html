<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unvibe Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: guided page (left, primary) | description + files + diff (right, resizable). */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --sunk: #eef0f3; --ink: #1b1f27; --muted: #5c6472; --line: #dde1e7;
  --accent: #0b6e78; --accent-soft: #e2f1f2;
  --note: #9a6412; --note-soft: #fbf0d9; --note-mark: #f6e2b0;
  --add: #e5f4e9; --add-ink: #1d6b34; --del: #fbeaea; --del-ink: #9b2c2c; --warn: #a33b16; --warn-soft: #fbe8de;
  --ok: #2f7a3f;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121519; --surface: #191d23; --sunk: #20252d; --ink: #e5e8ed; --muted: #98a1b0; --line: #2b313b;
  --accent: #56c2cb; --accent-soft: #15333a; --note: #e2b257; --note-soft: #2f2716; --note-mark: #54421a;
  --add: #15301f; --add-ink: #8fd6a2; --del: #3a1d20; --del-ink: #f0a3a3; --warn: #f29a72; --warn-soft: #3a2218;
  --ok: #8fd6a2; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121519; --surface: #191d23; --sunk: #20252d; --ink: #e5e8ed; --muted: #98a1b0; --line: #2b313b;
  --accent: #56c2cb; --accent-soft: #15333a; --note: #e2b257; --note-soft: #2f2716; --note-mark: #54421a;
  --add: #15301f; --add-ink: #8fd6a2; --del: #3a1d20; --del-ink: #f0a3a3; --warn: #f29a72; --warn-soft: #3a2218;
  --ok: #8fd6a2; color-scheme: dark; }
html, body { height: 100%; }
/* Elements toggled with the hidden attribute must stay hidden even when their own rule sets display. */
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .35; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .86em; }
.sp { flex: 1; }
.ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -2px; }
.ib { display: inline-grid; place-items: center; width: 26px; height: 24px; border: 1px solid transparent; background: none; border-radius: 6px; color: var(--muted); padding: 0; }
.ib:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
.ib[aria-pressed="true"] { color: var(--ok); }
.ib.bd { border-color: var(--line); }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.top .pr { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1; }
.top .pr b { min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .pr .num { font-family: var(--mono); color: var(--muted); font-size: 12px; white-space: nowrap; }
.pill { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tbtn { border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tbtn[aria-pressed="true"], .tbtn[aria-expanded="true"] { background: var(--sunk); }
.count { background: var(--note); color: var(--surface); border-radius: 99px; padding: 0 6px; font-size: 11px; }
.cols { display: grid; min-height: 0; }
.col { overflow: auto; min-width: 0; min-height: 0; }
#right { background: var(--surface); }
#handle { cursor: col-resize; background: var(--line); width: 6px; touch-action: none; }
#handle:hover, #handle.drag { background: var(--accent); }
.col.hide { display: none; }
.col.overlay { position: fixed; top: 50px; bottom: 0; right: 0; width: min(680px, 100vw); z-index: 25; box-shadow: 0 0 28px rgb(0 0 0 / .18); }
@media (max-width: 600px) { .top .pill { display: none; } }
.hint { font-size: 12px; color: var(--muted); }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; font-weight: 500; }
.btn.ghost { background: none; color: var(--ink); border-color: var(--line); }
.mini { border: 0; background: none; color: var(--muted); font-size: 11.5px; padding: 2px 5px; border-radius: 4px; }
.mini:hover { background: var(--sunk); color: var(--ink); }
.postchk { font-size: 11.5px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 0 8px; white-space: nowrap; height: 22px; }
.postchk[aria-pressed="true"] { background: var(--note); color: var(--surface); border-color: var(--note); }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.x:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); font-size: 12px; padding: 2px 9px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 0 8px; font-size: 11.5px; color: var(--muted); height: 22px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip span { opacity: .7; margin-left: 3px; }
.av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 600; flex: none; }
.av.you { background: var(--note-soft); color: var(--note); }
.av.ai { background: var(--accent-soft); color: var(--accent); }
.hl { background: var(--note-mark) !important; }
.composer { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.composer textarea { min-width: 0; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 13px/1.4 var(--sans); background: var(--surface); color: var(--ink); }
.composer .row { display: flex; gap: 6px; justify-content: flex-end; }
.msg { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 7px; margin: 5px 0; }
.msg .who { font-size: 11px; color: var(--muted); }
.msg p { margin: 1px 0 4px; }
.tfoot { display: flex; gap: 2px; align-items: center; margin-top: 2px; flex-wrap: wrap; }

/* ---------- right pane ---------- */
.rstick { position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; padding: 6px 12px 0; }
.tab { border: 0; background: none; padding: 6px 10px; border-bottom: 2px solid transparent; color: var(--muted); font-size: 13px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
.dtool { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 12px 8px; position: relative; }
.files { border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.frow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.files input[type="search"] { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: 12.5px var(--sans); background: var(--surface); color: var(--ink); }
.prog { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.bar { flex: 1; height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.flist { max-height: 34vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 3px 0; }
.fr { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; text-align: left; padding: 2px 10px; font: 12.5px/1.5 var(--sans); white-space: nowrap; }
.fr:hover { background: var(--sunk); }
.fr .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.fr.dir { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.fr .st, .fr .rv { font: 11px var(--mono); color: var(--muted); flex: none; }
.fr .rv.done { color: var(--ok); }
.st .a { color: var(--add-ink); } .st .d { color: var(--del-ink); }
.gtag { font-size: 9.5px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; flex: none; }
.cmenu { position: absolute; right: 12px; top: calc(100% - 4px); width: min(380px, calc(100% - 24px)); max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgb(0 0 0 / .16); padding: 8px; z-index: 6; display: flex; flex-direction: column; gap: 6px; }
.ci { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; padding: 6px; border-radius: 6px; }
.ci:hover { background: var(--sunk); }
.cj { border: 0; background: none; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cj .cw { font: 11px var(--mono); color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cj .cx2 { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ci textarea { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 4px; font: 12.5px/1.4 var(--sans); padding: 5px; resize: vertical; min-height: 56px; background: var(--surface); color: var(--ink); }
.prtag { font-size: 10.5px; color: var(--note); border: 1px solid var(--note); border-radius: 99px; padding: 0 6px; white-space: nowrap; }
.confirm { background: var(--sunk); border-radius: 6px; padding: 10px; font-size: 12.5px; display: flex; flex-direction: column; gap: 8px; }
.desc { padding: 16px 20px 40px; font-size: 13.5px; }
.desc.editing { outline: 2px solid var(--accent); outline-offset: -8px; border-radius: 10px; background: var(--surface); }
.dbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 20px 0; font-size: 12.5px; }
.desc h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
.desc p, .desc li { margin: 6px 0; }
.desc .para { border-radius: 4px; padding: 2px 6px; margin-inline: -6px; transition: background .4s; }
.desc .back { font-size: 11.5px; color: var(--accent); background: none; border: 0; padding: 0; margin-left: 4px; }
.desc table, .md table { border-collapse: collapse; font-size: 12.5px; margin: 8px 0; }
.desc th, .desc td, .md th, .md td { border: 1px solid var(--line); padding: 4px 7px; text-align: left; vertical-align: top; }
.desc th, .md th { background: var(--sunk); font-weight: 600; }
.author { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.dfile { margin: 0 0 18px; }
.dfile-h { background: var(--sunk); padding: 4px 8px; font-family: var(--mono); font-size: 12px; display: flex; gap: 6px; align-items: center; border-block: 1px solid var(--line); }
.dfile-h .path { display: flex; min-width: 0; flex: 1; white-space: nowrap; }
.dfile-h .path .dir { overflow: hidden; text-overflow: ellipsis; color: var(--muted); min-width: 0; }
.dfile-h .path b { font-weight: 500; flex: none; }
.dfile-h .st { flex: none; }
.revc { font: 11px var(--mono); color: var(--muted); flex: none; }
/* Diff tables scroll sideways; .pin rows stay the pane's width so their controls never scroll out of view. */
.dwrap { overflow-x: auto; container-type: inline-size; }
.pin { position: sticky; left: 0; width: 100cqw; box-sizing: border-box; }
table.diff { border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; min-width: 100%; }
table.diff td { padding: 0 8px; white-space: pre; vertical-align: top; }
/* Split view: two equal halves, long lines wrap inside their half instead of widening it. */
table.diff.split { table-layout: fixed; width: 100%; }
table.diff.split col.cn { width: 3.6em; }
table.diff.split td.c { white-space: pre-wrap; overflow-wrap: anywhere; }
table.diff td.n { color: var(--muted); text-align: right; width: 1%; user-select: none; opacity: .75; }
table.diff td.n.new { cursor: pointer; }
table.diff td.n.new:hover { color: var(--note); opacity: 1; text-decoration: underline; }
table.diff td.n.hc { color: var(--note); opacity: 1; }
table.diff td.n.hc .ic { width: 11px; height: 11px; margin-right: 3px; vertical-align: -1px; }
table.diff td.add, table.diff tr.add td { background: var(--add); }
table.diff td.del, table.diff tr.del td { background: var(--del); }
table.diff td.empty { background: var(--sunk); }
table.diff .cm { color: var(--muted); font-style: italic; }
table.diff tr.hl td { background: var(--note-mark) !important; }
table.diff tr.pr > td { padding: 0; white-space: normal; font-family: var(--sans); }
.hh { display: flex; align-items: center; gap: 4px; padding: 3px 6px; background: var(--sunk); border-top: 1px solid var(--line); }
.hh .hl2 { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.hh .hl2 b { color: var(--ink); font-weight: 500; }
.hh.rev .hl2 { opacity: .6; }
.fwrap { padding: 6px 10px; background: var(--bg); }
.fcard { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.fcard.rev { background: var(--sunk); border-color: transparent; opacity: .65; }
.fsum { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.fsum p { margin: 0; }
.hid { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; border: 0; border-top: 1px solid var(--line); background: var(--bg); color: var(--muted); font: 11.5px var(--sans); padding: 1px 8px; text-align: left; }
.hid:hover { color: var(--ink); }
.hid .ic { align-self: center; }
.hid .hidl { flex: none; white-space: nowrap; }
.hid .hidb { min-width: 12em; flex: 1; font-style: italic; }
.hid .hidb code { font-style: normal; font-size: 10.5px; }
.x[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.folded { border: 0; background: var(--bg); color: var(--muted); font: 12px var(--sans); padding: 3px 10px; text-align: left; width: 100%; }
.folded:hover { color: var(--ink); }

/* ---------- guided page ---------- */
#page { padding: 24px clamp(16px, 4vw, 48px) 140px; }
.doc { max-width: 760px; margin: 0 auto; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted); }
.crumbs button:hover { color: var(--ink); text-decoration: underline; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.eyebrow.find { color: var(--warn); }
.ib.save { width: 22px; height: 20px; }
.ib.save[aria-pressed="true"] { color: var(--accent); }
.ib.save[aria-pressed="true"] .ic { fill: currentColor; }
h1.title { font-family: var(--serif); font-weight: 600; font-size: clamp(25px, 3vw, 33px); line-height: 1.18; margin: 6px 0 10px; text-wrap: balance; }
.meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; }
.prov { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 2px 0 6px; }
.prov::before { content: "agent · "; color: var(--accent); }
.know { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 9px; font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--ink); }
.know[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.toc { margin: 14px 0 4px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13px; background: var(--surface); }
.toc-h { display: flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-left: -6px; }
.toc-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 24px; margin-top: 4px; }
.toc h3 { font-size: 11px; color: var(--muted); font-weight: 600; margin: 6px 0 2px; }
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc li button { border: 0; background: none; padding: 2px 0; text-align: left; display: flex; gap: 6px; align-items: baseline; width: 100%; font-size: 13px; }
.toc li button:hover .tt { text-decoration: underline; }
.toc .kd { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); width: 1.4em; flex: none; }
.toc .rd { color: var(--ok); margin-left: auto; flex: none; }
.toc .rd.new { color: var(--muted); font-size: 11px; }
.toc .done .tt { color: var(--muted); }
.divider { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 30px 0 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; margin: 14px 0; position: relative; }
.chead { display: flex; align-items: center; gap: 4px; margin-left: -10px; }
.chead h2.ct { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0; text-wrap: balance; flex: 1; min-width: 0; }
.card.collapsed { padding-block: 8px; }
.card.collapsed h2.ct { font-size: 18px; }
.cprev { flex: 1; min-width: 0; margin: 0; font-family: var(--serif); font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.read { background: var(--sunk); border-color: transparent; }
/* A finding's own page carries the same warning accent as its card in the guide. */
.doc.finding > .card { border-left: 3px solid var(--warn); }
.card.read > :not(.ctl):not(.chead), .card.read .chead h2, .card.read .chead .cprev { opacity: .55; transition: opacity .2s; }
.card.read:hover > :not(.ctl):not(.chead), .card.read:hover .chead h2 { opacity: .9; }
.card.child { margin: 8px 0 14px 10px; border-left: 3px solid var(--accent); padding: 8px 14px; }
.card.child.collapsed .exp-b, .card.child.collapsed .ctl { display: none; }
.card.child.on { box-shadow: 0 0 0 2px var(--accent-soft); }
.card.pend { border-style: dashed; background: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; }
.card.pend .pl { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.card.pend .why { font-size: 13px; color: var(--muted); grid-column: 1; }
.card.pend .go { grid-row: 1 / span 2; grid-column: 2; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 6px; padding: 5px 12px; font-weight: 500; }
.card.pend .go:hover { background: var(--accent-soft); }
.ctl { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; margin: 4px 0 4px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
.card.child .ctl { border: 0; padding-bottom: 0; }
.depth { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin-right: 4px; height: 24px; }
.depth button { border: 0; background: none; width: 24px; height: 22px; font-size: 14px; line-height: 1; color: var(--muted); }
.depth button:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
.depth .dl { display: inline-flex; align-items: center; padding: 0 8px; border-inline: 1px solid var(--line); height: 22px; }
.pips { display: inline-flex; gap: 2px; } .pips i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); } .pips i.on { background: var(--accent); }
.blk { position: relative; }
.prose, .lst li { font-family: var(--serif); font-size: 17px; line-height: 1.62; }
.prose { margin: 10px 0; }
.card.child .prose { font-size: 16px; }
.lst { padding-left: 22px; margin: 8px 0; }
.lst li { margin: 6px 0; }
.md { overflow-x: auto; }
.md td, .md th { font-size: 14px; line-height: 1.45; }
.card code { background: var(--sunk); padding: 1px 4px; border-radius: 3px; }
.card h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 2px; }

  const pa = e.target.closest("[data-refs], [data-threads], mark[data-thr], mark.exl, a.cx[data-node], [data-cprev], [data-popkey]");
  clearTimeout(openT); overAnchor = pa;
  if (pa) { clearTimeout(popT); if (pa !== popAnchor) openT = setTimeout(() => { if (scrollQuiet || !pa.isConnected || overAnchor !== pa) return; const h = popFor(pa); if (h) showPop(pa, h); }, 180); }
  else if (popAnchor) { clearTimeout(popT); popT = setTimeout(hidePop, 220); }
  $$("#page .on").forEach(x => x.classList.remove("on"));
  const m = e.target.closest("mark[data-thr], mark[data-jump]");
  if (m) { m.classList.add("on"); (byId(m.dataset.thr || "") || byId("B-" + m.dataset.jump))?.classList.add("on"); }
  const th = e.target.closest("#page .ithread");
  if (th) { th.classList.add("on"); $$(`mark[data-thr="${th.id}"]`).forEach(x => x.classList.add("on")); }
});

// ================================================================ events
document.addEventListener("click", e => {
  byId("tip").hidden = true;
  if (!e.target.closest("#pop")) hidePop();
  const el = e.target.closest("button, a, td.n.new, mark"); if (!el) { if (state.cmOpen && !e.target.closest(".cmenu")) { state.cmOpen = false; renderRight(); } return; }
  const d = el.dataset;
  if (d.node) { e.preventDefault(); go(d.node); }
  else if (d.src) showSource(d.src);
  else if (d.threads) { const ids = d.threads.split("|"), show = !threadShown(findBlock(ids[0]).b); ids.forEach(id => setThreadShown(findBlock(id).b, show)); rerender(); if (show) byId(ids[0])?.scrollIntoView({ block: "nearest" }); }
  else if (d.thr) { const t = findBlock(d.thr).b; setThreadShown(t, !threadShown(t)); rerender(); }
  else if (d.jump) { const b = findBlock(d.jump)?.b; if (b?.collapsed) { b.collapsed = false; b.read = false; rerender(); } byId("B-" + d.jump)?.scrollIntoView({ block: "center", behavior: RM ? "auto" : "smooth" }); }
  else if (d.closethr) { setThreadShown(findBlock(d.closethr).b, false); rerender(); }
  else if (d.rtab) { state.rtab = d.rtab; renderRight(); }
  else if ("files" in d) { state.filesOpen = !state.filesOpen; renderRight(); if (state.filesOpen) byId("right").scrollTop = 0; }
  else if ("cm" in d) { state.cmOpen = !state.cmOpen; state.confirm = false; renderRight(); }
  else if (d.cmf) { state.cmFilter = d.cmf; state.confirm = false; renderRight(); }
  else if (d.cjump) jumpToComment(d.cjump);
  else if (d.view) { state.view = d.view; if (d.view === "split" && state.rw < innerWidth * 0.48) { state.rw = Math.min(innerWidth - 420, Math.round(innerWidth * 0.52)); applyCols(); } renderRight(); }
  else if (d.cat) { state.cats.has(d.cat) ? state.cats.delete(d.cat) : state.cats.add(d.cat); renderRight(); }
  else if ("hiderev" in d) { state.hideReviewed = !state.hideReviewed; renderRight(); }
  else if (d.dir) { state.dirOpen[d.dir] = !(state.dirOpen[d.dir] ?? true); renderRight(); }
  else if (d.jumpfile) { state.rtab = "diff"; state.fileFold[d.jumpfile] = false; openRight(); renderRight(); const t = byId("F-" + d.jumpfile); if (t) byId("right").scrollTop += t.getBoundingClientRect().top - $(".rstick").getBoundingClientRect().bottom; }
  else if (d.ffold) { state.fileFold[d.ffold] = !state.fileFold[d.ffold]; renderRight(); }
  else if (d.frev) { const f = FILE[d.frev], all = revCount(f) === f.hunks.length; f.hunks.forEach((_, i) => Object.assign(H(f.key, i), { reviewed: !all, folded: !all })); renderRight(); }
  else if (d.hfold) { const hs = state.hunks[d.hfold] ??= {}; hs.folded = !hs.folded; renderRight(); }
  else if (d.hsum) summarize(d.hsum);
  else if (d.hsumdel) { state.hunks[d.hsumdel].summary = null; renderRight(); }
  else if (d.hnote) { (state.hunks[d.hnote] ??= {}).noteEditing = true; renderRight(); byId("hn-" + d.hnote)?.focus(); }
  else if (d.hnsave) { const hs = state.hunks[d.hnsave]; hs.note = byId("hn-" + d.hnsave).value.trim(); hs.noteEditing = false; renderRight(); }
  else if (d.hndiscard) { state.hunks[d.hndiscard].noteEditing = false; renderRight(); }
  else if (d.hnotedel) { state.hunks[d.hnotedel].note = ""; renderRight(); }
  else if (d.hrev) { const hs = state.hunks[d.hrev] ??= {}; hs.reviewed = !hs.reviewed; hs.folded = hs.reviewed; renderRight(); }
  else if ("hideboring" in d) { state.hideBoring = !state.hideBoring; if (state.hideBoring) Object.values(state.hunks).forEach(h => h.unhidden = false); renderRight(); }
  else if ("foldall" in d) foldAll();
  else if (d.unhide) { const [key, list] = d.unhide.split(":"); list.split(",").forEach(i => H(key, +i).unhidden = true); renderRight(); }
  else if ("unfoldall" in d) { Object.values(state.hunks).forEach(h => h.folded = false); state.fileFold = {}; renderRight(); }
  else if (d.gen) generate(d.gen);
  else if (d.follow) follow(d.follow, +d.i);
  else if (d.xf) transform(d.doc, d.xf);
  else if (d.undo) { undo(docOf(d.undo)); rerender(); }
  else if (d.read) { const doc = docOf(d.read); doc.read = !doc.read; doc.collapsed = doc.read; rerender(); }
  else if (d.ccol) { const doc = docOf(d.ccol); doc.collapsed = !doc.collapsed; renderPage(); }
  else if ("toc" in d) { state.tocOpen = !state.tocOpen; renderPage(); }
  else if (d.tocard) { const c = findCard(d.tocard).card; c.collapsed = false; renderPage(); byId("C-" + d.tocard)?.scrollIntoView({ block: "start", behavior: RM ? "auto" : "smooth" }); }
  else if (d.promote) promote(d.promote);
  else if (d.collapse) { const b = findBlock(d.collapse).b; b.collapsed = !b.collapsed; rerender(); }
  else if (d.remove) { const fb = findBlock(d.remove); if (fb.b.t === "thread" || fb.diff) removeThread(d.remove); else fb.card.blocks.splice(fb.i, 1); rerender(); }
  else if (d.discard) { const t = findBlock(d.discard).b; if (!t.msgs.length) removeThread(d.discard); else t.reply = ""; rerender(); }
  else if (d.comment) { const host = $(`#page [data-top="${d.comment}"]`); openThread({ top: d.comment }, (host?.textContent || "").trim().slice(0, 60) + "…"); }
  else if (d.send) send(d.send);
  else if (d.post) { const t = findBlock(d.post).b; t.post = !t.post; state.confirm = false; rerender(); }
  else if (d.suggest) {
    // Lands on the cited diff line; if that line already has a thread, the suggestion joins it.
    const s = findBlock(d.suggest).b, [, file, line] = s.loc.split(":"), key = `${file}:${line}`;
    const ex = state.diffThreads[key];
    if (ex) { ex.msgs.push({ who: "you", text: s.text }); Object.assign(ex, { post: true, fromSuggest: s.id, collapsed: false }); }
    else state.diffThreads[key] = { id: uid("t"), file, line: +line, post: true, fromSuggest: s.id, msgs: [{ who: "you", text: s.text }] };
    renderPage(); showSource(s.loc);
  }
  else if ("submit" in d) { state.submitOpen = !state.submitOpen; state.submitted = false; renderSubmit(); }
  else if ("submitclose" in d) { state.submitOpen = false; state.submitted = false; renderSubmit(); }
  else if ("submitgo" in d) { state.submitted = true; renderSubmit(); }
  else if ("asauthor" in d) { PR.viewer = PR.author; PR.merged = false; renderRight(); }
  else if ("descedit" in d) { state.descEditing = true; state.descConfirm = false; renderRight(); byId("descEdit")?.focus(); }
  else if ("descdiscard" in d) { state.descEditing = false; state.descDraft = null; renderRight(); }
  else if ("descsave" in d) { state.descHtml = cleanDesc(byId("descEdit")); state.descDraft = null; state.descEditing = false; rerender(); }
  else if ("descrevert" in d) { state.descHtml = null; rerender(); }
  else if (d.save) { const n = NODES[d.save]; n.saved = !isSaved(n); renderPage(); toast(n.saved ? "Saved to this repo" : "Removed from saved pages"); }
  else if (d.line) { const [file, line] = d.line.split(":"); state.diffThreads[d.line] ??= { id: uid("t"), file, line: +line, msgs: [], composing: true }; state.diffThreads[d.line].collapsed = false; renderRight(); byId("ta-" + state.diffThreads[d.line].id)?.focus(); }
  else if (d.back) { go("root"); const host = $(`#page [data-top="${d.back}"]`); host?.scrollIntoView({ block: "center" }); host?.classList.add("hl"); setTimeout(() => host?.classList.remove("hl"), 2000); }
});
document.addEventListener("input", e => {
  if (e.target.id === "fq") { const v = e.target.value; state.fq = v; renderRight(); const f = byId("fq"); f.focus(); f.setSelectionRange(v.length, v.length); return; }
  if (e.target.closest?.("#descEdit")) { state.descDraft = cleanDesc(byId("descEdit")); return; }
  if (e.target.id?.startsWith("ob-")) findBlock(e.target.id.slice(3)).b.draft = e.target.value;
  if (e.target.id?.startsWith("ta-")) { const fb = findBlock(e.target.id.slice(3)); if (fb) fb.b.reply = e.target.value; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id?.startsWith("ta-")) send(e.target.id.slice(3));
  if (e.key === "Escape") { byId("selbar").hidden = true; hidePop(); if (state.cmOpen) { state.cmOpen = false; renderRight(); } }
});
byId("toggleRight").onclick = () => { state.rightOpen = !rightOpen(); applyCols(); };

// selection toolbar
let pendingSel = null;
// Selections always cover whole words: grow a partial word at either end to its boundary.
const WORD = /[\p{L}\p{N}_'’]/u;
function snapToWords(sel) {
  if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0).cloneRange();
  let { startContainer: sc, startOffset: so, endContainer: ec, endOffset: eo } = r;
  if (sc.nodeType === 3) { while (so < sc.data.length && /\s/.test(sc.data[so])) so++; while (so > 0 && WORD.test(sc.data[so - 1]) && WORD.test(sc.data[so] ?? "")) so--; }
  if (ec.nodeType === 3) { while (eo > 0 && /\s/.test(ec.data[eo - 1])) eo--; while (eo < ec.data.length && WORD.test(ec.data[eo]) && WORD.test(ec.data[eo - 1] ?? "")) eo++; }
  try { r.setStart(sc, so); r.setEnd(ec, eo); } catch { return; }
  if (r.collapsed) return;
  sel.removeAllRanges(); sel.addRange(r);
}
function selHost(node) {
  const p = node.closest("#page [data-top], #right [data-top]");
  if (p) return { top: p.dataset.top };
  const td = node.closest("#right table.diff td.c"); if (!td) return null;
  // Rows without a new-side line number (pure deletions) anchor to the nearest numbered row.
  const tr = td.closest("tr"); let r = tr;
  while (r && !r.id?.startsWith("L-")) r = r.nextElementSibling;
  if (!r) { r = tr; while (r && !r.id?.startsWith("L-")) r = r.previousElementSibling; }
  const m = r?.id.match(/^L-(\w+)-(\d+)$/);
  return m ? { dkey: `${m[1]}:${m[2]}` } : null;
}
document.addEventListener("mouseup", e => {
  if (e.target.closest("#selbar")) return;
  if (!e.target.closest("#page, #right .desc:not(.editing), #right table.diff") || e.target.closest("button, a, input, textarea")) { byId("selbar").hidden = true; return; }
  setTimeout(() => {
    const sel = getSelection(), bar = byId("selbar");
    snapToWords(sel);
    const q = sel.toString().trim().replace(/\s+/g, " ");
    const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
    const host = node && selHost(node);
    if (!q || q.length < 2 || q.length > 300 || !host) { bar.hidden = true; return; }
    pendingSel = { q, host };
    const r = sel.getRangeAt(0).getBoundingClientRect();
    bar.hidden = false;
    bar.style.left = Math.max(8, Math.min(innerWidth - bar.offsetWidth - 8, r.left + r.width / 2 - bar.offsetWidth / 2)) + "px";
    bar.style.top = (r.top - bar.offsetHeight - 8 < 56 ? r.bottom + 8 : r.top - bar.offsetHeight - 8) + "px";
  }, 0);
});
byId("selbar").addEventListener("mousedown", e => e.preventDefault());
byId("selbar").addEventListener("click", e => {
  const act = e.target.dataset.act; if (!act || !pendingSel) return;
  byId("selbar").hidden = true; getSelection().removeAllRanges();
  const { q, host } = pendingSel; pendingSel = null;
  if (act === "ask" || act === "note") openThread(host, q, act === "note"); else expand(act, q, host);
});
// Floating UI (hover card, tooltip, selection bar) dismisses on any scroll, outside press, focus loss or resize.
const dismissFloating = () => { clearTimeout(openT); clearTimeout(popT); hidePop(); byId("tip").hidden = true; byId("selbar").hidden = true; };
document.addEventListener("scroll", e => { if (e.target.closest?.("#pop")) return; scrollQuiet = true; dismissFloating(); }, true);
document.addEventListener("wheel", e => { if (!e.target.closest?.("#pop")) { scrollQuiet = true; dismissFloating(); } }, { capture: true, passive: true });
document.addEventListener("pointerdown", e => {
  byId("tip").hidden = true;
  if (!e.target.closest("#pop")) hidePop();
  if (!e.target.closest("#selbar")) byId("selbar").hidden = true;
}, true);
document.documentElement.addEventListener("mouseleave", () => { hidePop(); byId("tip").hidden = true; });
addEventListener("blur", dismissFloating);
addEventListener("resize", dismissFloating);
document.addEventListener("selectionchange", () => { if (getSelection().isCollapsed) byId("selbar").hidden = true; });

applyCols(); renderPage(); renderRight();
</script>
